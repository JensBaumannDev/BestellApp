<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestellApp</title>
    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/assets.css" />
    <link rel="stylesheet" href="./styles/basket.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="icon" type="image/svg+xml" href="./assets/img/logo1.svg" />
  </head>
  <body>
    <nav class="top-bar">
      <div class="top-bar-content">
        <img src="./assets/img/logo2.svg" class="nav-logo" alt="Logo" />
        <div class="burger-menu">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </nav>
    <header class="hero-section">
      <img src="./assets/img/header.png" class="hero-image" alt="Header" />
      <img
        src="./assets/img/burger-logo.png"
        class="profile-logo"
        alt="Restaurant Logo"
      />
      <div class="restaurant-title-container">
        <h1><span>BURGER</span> HAUS</h1>
      </div>
    </header>
    <main>
      <div class="content-wrapper">
        <div class="burger-content-inner" id="burger-content">
          <h3 class="category-headline">Burger</h3>
        </div>
        <div class="pizza-content-inner" id="pizza-content">
          <h3 class="category-headline">Pizza</h3>
        </div>
        <div class="nudles-content-inner" id="nudles-content">
          <h3 class="category-headline">Burger</h3>
        </div>
        <div class="extra-content-inner" id="extra-content">
          <h3 class="category-headline">Burger</h3>
        </div>

        <section class="basket-wrapper" id="basket-wrapper">
          <h2>Warenkorb</h2>
        </section>
      </div>
    </main>
    <footer>
      <div class="footer-content">
        <p>(C) 2026 Burger Hause</p>
        <a href="#" class="footer-link">Impressum</a>
        <a href="#" class="footer-link">Cookie Einstellungen</a>
        <p></p>
      </div>
    </footer>
  </body>
  <script src="./scripts/db.js"></script>
  <script src="./scripts/template.js"></script>
</html>
